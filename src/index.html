<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Directorio de Contactos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Directorio de contactos universitarios y profesionales">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script>
    // GitHub Pages SPA redirect via session storage
    (function(sessionStorage) {
      var path = sessionStorage.getItem('redirect');
      if (path) {
        sessionStorage.removeItem('redirect');
        window.location.replace(path);
      }
    })(sessionStorage);
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
